# Template for comparing multiple registration presets across one or more run
# images using one shared image.
#
# Behavior:
# - output_root is required
# - each run can be written into a subfolder such as:
#     {output_root}/{image_id}_{preset_name}

output_root: Z:\path\to\parameter_sweeps\my_sweep
shared_image_role: moving
orientation_alignment: none

shared_image:
  image_id: "shared_template"
  image: Z:\path\to\template.nii.gz
  space:
    space_name: template_space
    orientation: las
    resolution_um: [20.0, 20.0, 20.0]

registration_presets:
  - C:\Users\YourName\Documents\GitHub\atlasbuilder\configs\registration_presets\baseline_syn_kimlab.yaml
  - C:\Users\YourName\Documents\GitHub\atlasbuilder\configs\registration_presets\tuned_syn_cc.yaml

run_images:
  - image_id: "100478"
    image: Z:\path\to\100478_ch1_iso20um.nii.gz
    space:
      space_name: subject_space
      orientation: las
      resolution_um: [20.0, 20.0, 20.0]

  - image_id: "100581"
    image: Z:\path\to\100581_ch1_iso20um.nii.gz
    space:
      space_name: subject_space
      orientation: las
      resolution_um: [20.0, 20.0, 20.0]
