# Example batch config for atlasspace registration.
# Copy this file and update the paths for your own machine/data.

shared_image_role: moving
orientation_alignment: fixed_to_moving

shared_image:
  image_id: "shared_template"
  image: Z:\path\to\moving_template.nii.gz
  space:
    space_name: template_space
    orientation: las
    resolution_um: [20.0, 20.0, 20.0]

registration_preset: baseline_syn_kimlab
output_subdir_name: registration_example_batch

run_images:
  - image_id: "100478"
    image: Z:\path\to\100478_ch1_iso20um.nii.gz
    space:
      space_name: subject_space
      orientation: las
      resolution_um: [20.0, 20.0, 20.0]
