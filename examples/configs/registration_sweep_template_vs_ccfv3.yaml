# Example sweep config for template-to-template registration against CCFv3.
# This assumes the moving template has already been pose standardized to match
# the intended CCFv3 orientation convention closely enough that no additional
# run-level reorientation is needed.

shared_image_role: fixed
orientation_alignment: none

shared_image:
  image_id: "ccfv3_p56_iso20um"
  image: Z:\path\to\ccfv3_p56_iso20um.nii.gz
  space:
    space_name: ccfv3_p56
    orientation: lsp
    resolution_um: [20.0, 20.0, 20.0]

registration_presets:
  - baseline_syn_kimlab
  - tuned_syn_cc

output_root: Z:\path\to\template_registration_sweeps\template_vs_ccfv3

run_images:
  - image_id: "lsfm_neun_p56_template0"
    image: Z:\path\to\lsfm_neun_p56_template0_masked_pose_standardized.nii.gz
    space:
      space_name: lsfm_neun_p56_template0
      orientation: lsp
      resolution_um: [20.0, 20.0, 20.0]
